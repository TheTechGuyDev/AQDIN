name: aqdin
description: A privacy-first Muslim matrimonial platform.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/aqdin_mark.svg
  fonts:
    - family: AqdinSerif
      fonts:
        - asset: assets/fonts/NotoSerif-Regular.ttf
        - asset: assets/fonts/NotoSerif-Bold.ttf
          weight: 700
    - family: AqdinSans
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
        - asset: assets/fonts/Inter-SemiBold.otf
          weight: 600

flutter_native_splash:
  color: "#07362A"
  image: assets/branding/aqdin_splash.png
  android_12:
    color: "#07362A"
    image: assets/branding/aqdin_mark.png
  android: true
  ios: true
  web: true

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/aqdin_mark.png
  adaptive_icon_background: "#07362A"
  adaptive_icon_foreground: assets/branding/aqdin_mark.png
